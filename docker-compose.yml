services:
  # ----------------------------------------------------------------------------
  # preflight: guarda de sanidade. Antes de QUALQUER coisa subir, verifica que a
  # base bruta da ANS está em data/. Se faltar, sai com código 1 e uma mensagem
  # clara — como spark/pipeline/streamlit dependem dele (service_completed_
  # successfully), o `docker compose up` ABORTA aqui em vez de falhar lá no fundo
  # do Spark. ./data é bind mount (não é copiado p/ imagem), por isso a checagem é
  # na subida e não no build. Trocar de competência exige ajustar o nome abaixo.
  # ----------------------------------------------------------------------------
  #
  # NOTA sobre nomes de container: NENHUM serviço fixa `container_name`. O Compose
  # nomeia por projeto (`<pasta>-<serviço>-<n>`), então dois clones do repo em
  # pastas diferentes não colidem — e um container parado nunca bloqueia o nome de
  # outro. (Antes, os nomes fixos `case-*` conflitavam entre clones, mesmo desligados.)
  preflight:
    image: busybox:latest
    volumes:
      - ./data:/data:ro
    command:
      - sh
      - -c
      - |
        if [ ! -f /data/pda-024-icb-SP-2025_08.csv ]; then
          echo '' >&2
          echo 'ERRO: base nao encontrada em data/pda-024-icb-SP-2025_08.csv' >&2
          echo 'Baixe a base da ANS (veja README > Dados) e coloque em data/ antes de subir.' >&2
          exit 1
        fi
        echo 'Base encontrada em data/. Prosseguindo.'

  # ----------------------------------------------------------------------------
  # MinIO: object storage compatível com S3 -> emula o Amazon S3 (o "data lake").
  # Buckets bronze/silver/gold vivem aqui, exatamente como viveriam no S3 da AWS.
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web (http://localhost:9001)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # minio-init: cria o bucket do lakehouse uma vez, na subida do ambiente.
  # ----------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      mc mb -p local/${LAKE_BUCKET:-lakehouse};
      echo 'Bucket ${LAKE_BUCKET:-lakehouse} pronto.';
      "

  # ----------------------------------------------------------------------------
  # spark: motor de processamento (PySpark + Delta Lake).
  # É o equivalente local ao Databricks/Glue: roda o ETL das camadas Medallion.
  # É o alvo do `docker exec` disparado pelas tasks do Airflow (que resolve o
  # container do serviço `spark` pelo label do Compose, não por nome fixo); por
  # isso o container fica vivo com `tail -f /dev/null` (o JupyterLab, que antes o
  # mantinha de pé, agora vive no serviço dedicado `jupyter`).
  # ----------------------------------------------------------------------------
  spark:
    build: .
    depends_on:
      preflight:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment: &spark-env
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      LAKE_BUCKET: ${LAKE_BUCKET:-lakehouse}
      LAKE_ROOT: s3a://${LAKE_BUCKET:-lakehouse}
      CSV_PATH: ${CSV_PATH:-/app/data/pda-024-icb-SP-2025_08.csv}
    ports:
      - "4040:4040"   # Spark UI (quando um job está rodando)
    volumes: &spark-volumes
      - ./src:/app/src
      - ./sql:/app/sql
      - ./notebooks:/app/notebooks
      - ./data:/app/data
      - ./output:/app/output
      - ivy-cache:/root/.ivy2
      - spark-events:/spark-events   # event logs lidos pelo History Server
    command: ["tail", "-f", "/dev/null"]   # mantém o container vivo p/ o docker exec do Airflow

  # ----------------------------------------------------------------------------
  # pipeline: job ONE-SHOT que roda o ETL completo (Bronze -> Silver -> Gold ->
  # Consultas) e sai. É o que torna o fluxo "um comando só": no `docker compose up`
  # ele roda depois que a base foi validada (preflight) e o bucket criado
  # (minio-init), e o streamlit só sobe DEPOIS que ele termina (ver depends_on lá
  # embaixo). Assim o dashboard nasce já com os dados em output/ — sem estado vazio
  # e sem precisar reiniciar.
  #
  # Roda-SÓ-SE-necessário: se os 5 CSVs da Gold já estão em output/, PULA o
  # reprocessamento (checagem de arquivo, instantânea — sem subir o Spark), então
  # do 2º `up` em diante o ambiente sobe em segundos. Para FORÇAR um reprocesso:
  # apague output/*.csv, ou rode o comando manual (que sempre reprocessa):
  #   docker compose exec spark python -m src.run_pipeline
  # O pipeline é idempotente (full-refresh), então reprocessar é sempre seguro.
  # Reusa a imagem/env/volumes do spark.
  # ----------------------------------------------------------------------------
  pipeline:
    build: .
    depends_on:
      preflight:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment: *spark-env
    volumes: *spark-volumes
    command:
      - sh
      - -c
      - |
        ok=1
        for f in a_top5_operadoras b_faixa_etaria_top c_beneficiarios_por_municipio \
                 insight_operadoras insight_faixa_etaria; do
          [ -f "/app/output/$$f.csv" ] || ok=0
        done
        if [ "$$ok" = 1 ]; then
          echo 'Gold ja processada (5 CSVs presentes em output/). Pulando o pipeline.'
          echo 'Para reprocessar: apague output/*.csv ou rode: docker compose exec spark python -m src.run_pipeline'
        else
          python -m src.run_pipeline
        fi

  # ----------------------------------------------------------------------------
  # jupyter: JupyterLab (mesma imagem/volumes do spark), estilo Databricks.
  # Serviço separado só para ter linha própria no Docker Desktop com a porta 8888
  # clicável. Usa o CMD padrão do Dockerfile (jupyter lab).
  # ----------------------------------------------------------------------------
  jupyter:
    build: .
    depends_on:
      preflight:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment: *spark-env
    ports:
      - "8888:8888"   # JupyterLab (http://localhost:8888)
      - "4041:4040"   # Spark UI dos jobs rodados no notebook (http://localhost:4041)
    volumes: *spark-volumes

  # ----------------------------------------------------------------------------
  # spark-history: Spark History Server. Lê os event logs gravados pelo pipeline
  # e pelo notebook (volume spark-events) e serve a Spark UI de execuções JÁ
  # FINALIZADAS em http://localhost:18080 — persistente, ao contrário da 4040/4041
  # (que só existem enquanto o job roda). Reaproveita a imagem do spark: o pacote
  # PySpark já traz o sbin/start-history-server.sh.
  # ----------------------------------------------------------------------------
  spark-history:
    build: .
    environment:
      SPARK_NO_DAEMONIZE: "1"   # roda em foreground (o container é o próprio processo)
      SPARK_HISTORY_OPTS: "-Dspark.history.fs.logDirectory=file:///spark-events -Dspark.history.ui.port=18080"
    ports:
      - "18080:18080"   # Spark History Server (http://localhost:18080)
    volumes:
      - spark-events:/spark-events
    command:
      - bash
      - -c
      - |
        export SPARK_HOME=$$(python -c "import pyspark, os; print(os.path.dirname(pyspark.__file__))")
        exec "$$SPARK_HOME/sbin/start-history-server.sh"

  # ----------------------------------------------------------------------------
  # streamlit: dashboard/BI que consome a camada Gold (curada). Lê os CSVs já
  # materializados em output/ — não precisa de Spark/Java. É o equivalente local
  # a um Amazon QuickSight / Power BI / Databricks Dashboard lendo do warehouse.
  # ----------------------------------------------------------------------------
  streamlit:
    build: ./app
    # Só sobe DEPOIS que o pipeline one-shot termina com sucesso: garante que
    # output/ já está populado quando o dashboard inicia. Elimina o antigo
    # retrabalho (subir vazio -> rodar pipeline -> reiniciar o container).
    depends_on:
      pipeline:
        condition: service_completed_successfully
    ports:
      - "8501:8501"   # Dashboard (http://localhost:8501)
    environment:
      # No Docker Desktop/Windows os eventos de inotify não atravessam o bind
      # mount, então o watcher padrão nunca dispara. 'poll' faz o Streamlit
      # checar o mtime periodicamente e detectar as alterações do host.
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: poll
      # runOnSave fica FALSE de propósito: neste setup (Windows/Docker/WSL) o
      # auto-rerun reinicia o servidor a cada save e segfaultava o container
      # (Exit 139). Com false, ao salvar aparece o botão "Rerun" no topo — o
      # app rerroda no lugar, sem restart e sem crash.
      STREAMLIT_SERVER_RUN_ON_SAVE: "false"
    volumes:
      - ./output:/app/output          # resultados da camada Gold (só leitura lógica)
      # Monta o diretório (não o arquivo único): bind de arquivo único no Windows
      # prende o mount ao inode original; ao salvar (escrita atômica) o inode muda
      # e o container fica preso na versão antiga. Montar a pasta evita isso.
      - ./app:/app

  # ----------------------------------------------------------------------------
  # postgres: banco de metadados do Airflow (DAGs, runs, tasks, conexões).
  # Substitui o SQLite do modo standalone — em produção o metastore do Airflow
  # é sempre um RDBMS concorrente (Postgres/MySQL). Aqui emula o RDS.
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ----------------------------------------------------------------------------
  # airflow-init: tarefa única (one-shot) que migra o schema do metastore e
  # cria o usuário admin/admin. Roda antes do webserver e do scheduler.
  # Sair com Exited (0) é o esperado.
  # ----------------------------------------------------------------------------
  airflow-init:
    build: ./airflow
    depends_on:
      postgres:
        condition: service_healthy
    user: "0:0"
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      # Chave fixa da sessão do webserver (evita invalidar login a cada boot).
      AIRFLOW__WEBSERVER__SECRET_KEY: case-airflow-secret-key
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    command:
      - bash
      - -c
      - |
        airflow db migrate
        airflow users create -u admin -p admin -r Admin -f Admin -l User -e admin@example.com || true

  # ----------------------------------------------------------------------------
  # airflow-webserver: apenas a UI (http://localhost:8080). Não executa tasks.
  # ----------------------------------------------------------------------------
  airflow-webserver:
    build: ./airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    user: "0:0"
    environment: *airflow-env
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    command: airflow webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ----------------------------------------------------------------------------
  # airflow-scheduler: agenda e EXECUTA as tasks (LocalExecutor). Como cada task
  # é um `docker exec` no container do serviço `spark` (resolvido dinamicamente
  # pelo label do Compose, não por nome fixo), precisa do socket do Docker + CLI
  # (já na imagem). É aqui que a orquestração do pipeline acontece de fato.
  # ----------------------------------------------------------------------------
  airflow-scheduler:
    build: ./airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      spark:
        condition: service_started
    user: "0:0"  # root: garante acesso ao socket do Docker no Docker Desktop
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: airflow scheduler

volumes:
  minio-data:
  ivy-cache:
  postgres-data:
  airflow-logs:
  spark-events:
